# Application Configuration
spring.application.name=resume-builder
server.port=${PORT:8080}

# MongoDB Atlas / Database Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/resume_builder}
spring.data.mongodb.database=${MONGODB_DATABASE:resume_builder}
spring.data.mongodb.auto-index-creation=true

# JWT Security Configuration
# Default 256-bit key for local development (override in production via JWT_SECRET)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in milliseconds
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend / CORS Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# AI Provider Configuration (gemini or openai)
ai.provider=${AI_PROVIDER:gemini}

# Google Gemini API Configuration
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# OpenAI API Configuration
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Logging configuration
logging.level.com.example.resumebuilder=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=INFO
